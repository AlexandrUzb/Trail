# ============================================================================
# AdvokatAI - Render Blueprint Specification (Backend Web Service)
# Docs: https://render.com/docs/blueprint-spec
# ============================================================================

services:
  - type: web
    name: advokatai-api
    runtime: node
    plan: free
    region: frankfurt # Frankfurt (EU Central)
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production

      # Server-only AI Key
      - key: GEMINI_API_KEY
        sync: false

      # Admin Secret Key
      - key: ADMIN_API_KEY
        sync: false

      # Stateless Session Token Secret
      - key: JWT_SECRET
        generateValue: true

      # Supabase Server Configuration
      - key: SUPABASE_URL
        value: https://gkztwgxxcahwmzwvimzi.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_CujwKGKQIc70VQo4wQZWXw_r3O3Bhk0
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Allowed Frontend Origin for CORS
      - key: FRONTEND_URL
        sync: false
